<title>A Velha Torre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Leitura vertical de gibi: páginas empilhadas, quadros com sarjeta preta, balões em HTML sobre arte em canvas. */
:root{
  --sarjeta:#0d0e13; --tinta:#111014; --balao:#fffdf5; --legenda:#f0e3c2; --papel:#f5f1e4;
  --pauta:#9db4d6; --brasa:#ff5a24; --ouro:#e8b65a; --apagado:#8e90a4; --texto:#ebe7dc;
  --f-titulo:'IM Fell English SC', Georgia, 'Times New Roman', serif;
  --f-legenda:'IM Fell English', Georgia, 'Times New Roman', serif;
  --f-letra:'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --f-sfx:'Bangers', Impact, 'Arial Black', sans-serif;
  color-scheme:dark;
}
body{background:var(--sarjeta);color:var(--texto);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px;font-family:var(--f-legenda)}
.gibi{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:48px}
.capa-topo{display:flex;flex-direction:column;gap:6px;text-align:center;padding-block:8px 0}
.capa-topo .serie{font-family:var(--f-titulo);letter-spacing:.18em;color:var(--ouro);font-size:13px;text-transform:uppercase}
.capa-topo h1{font-family:var(--f-titulo);font-weight:400;font-size:clamp(30px,7vw,46px);margin:0;text-wrap:balance;line-height:1.05}
.capa-topo p{margin:0;color:var(--apagado);font-style:italic;font-size:15px}
.pagina{display:flex;flex-direction:column;gap:10px}
.num{font:12px var(--f-titulo);color:var(--apagado);letter-spacing:.2em;text-transform:uppercase;text-align:right}
.quadro{position:relative;border:3px solid #000;background:#000;overflow:hidden;box-shadow:0 0 0 1px #262833}
.quadro canvas{display:block;width:100%;height:auto}
.b{position:absolute;font-family:var(--f-letra);color:var(--tinta);background:var(--balao);border:2px solid #111;border-radius:20px;padding:.32em .7em .38em;font-size:clamp(13px,2.7vw,19px);line-height:1.18;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.b::after{content:"";position:absolute;width:13px;height:13px;background:var(--balao);border-right:2px solid #111;border-bottom:2px solid #111;bottom:-8px;left:20%;transform:rotate(45deg)}
.b.tr::after{left:auto;right:20%}
.b.tl::after{top:-8px;bottom:auto;transform:rotate(225deg)}
.b.trt::after{top:-8px;bottom:auto;left:auto;right:20%;transform:rotate(225deg)}
.b.n::after{display:none}
.b.grito{font-weight:700;letter-spacing:.02em;border-width:3px}
.b.pens{border-style:dashed;border-radius:48%/40%}
.b.pens::after{width:9px;height:9px;border-radius:50%;border:2px dashed #111;bottom:-14px;transform:none;left:24%}
.b.off{background:#fffdf5;font-style:italic}
.cap{position:absolute;font-family:var(--f-legenda);font-style:italic;color:#1b160e;background:var(--legenda);border:2px solid #111;padding:.35em .65em;font-size:clamp(13px,2.6vw,18px);line-height:1.22;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.cap.pautado{background:repeating-linear-gradient(var(--papel) 0 1.15em, var(--pauta) 1.15em calc(1.15em + 1px));color:#20306e;font-style:normal;font-family:var(--f-letra)}
.sfx{position:absolute;font-family:var(--f-sfx);color:#ffd23a;-webkit-text-stroke:2px #000;paint-order:stroke fill;font-size:clamp(30px,7.5vw,58px);letter-spacing:.04em;transform:rotate(-8deg);text-shadow:3px 3px 0 #000;line-height:1}
.titulo{position:absolute;left:0;right:0;top:4%;display:flex;flex-direction:column;align-items:center;gap:.25em;text-align:center;pointer-events:none}
.titulo strong{font-family:var(--f-titulo);font-weight:400;color:#fff6e0;font-size:clamp(22px,5.6vw,42px);text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.8);letter-spacing:.04em;line-height:1}
.titulo span{font-family:var(--f-legenda);font-style:italic;color:#ffe1a8;font-size:clamp(14px,3.2vw,22px);text-shadow:0 2px 6px #000}
.fim{display:flex;flex-direction:column;gap:14px;border-top:1px solid #2b2d38;padding-top:28px;color:var(--apagado);font-size:15px;line-height:1.55}
.fim h2{font-family:var(--f-titulo);font-weight:400;color:var(--texto);font-size:22px;margin:0}
.fim p{margin:0;max-width:65ch}
@media (prefers-reduced-motion: no-preference){.quadro canvas{animation:surge .5s ease-out both}}
@keyframes surge{from{filter:brightness(.6)}to{filter:none}}
</style>

<main class="gibi" id="gibi">
  <header class="capa-topo">
    <div class="serie">Kravenox · Antes do Cisma · Temporada 1</div>
    <h1>Capítulo 1: A Velha Torre</h1>
    <p>Role para ler. 24 páginas.</p>
  </header>
</main>

<script>
'use strict';
const TAU=Math.PI*2;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);}
function poly(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.globalAlpha=a==null?1:a;c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);c.restore();}
function vgrad(c,W,H,stops){const g=c.createLinearGradient(0,0,0,H);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));c.fillStyle=g;c.fillRect(0,0,W,H);}
function shade(c,W,H,a,col){c.save();c.globalAlpha=a;c.fillStyle=col||'#000';c.fillRect(0,0,W,H);c.restore();}
function vignette(c,W,H,a){const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(a==null?.55:a)+')');c.fillStyle=g;c.fillRect(0,0,W,H);}

/* ---------- PERSONAGENS DE ESPINHOS (fiéis ao desenho da caneta azul) ---------- */
const ARMS={
  stand:[[29,-50,0],[29,-37,0]],
  up:[[27,-70,-1.0],[31,-58,-.7]],
  point:[[36,-54,-.15],[50,-56,-.05]],
  hold:[[22,-48,.9],[16,-40,1.2]],
  head:[[18,-74,-2.4],[10,-84,-2.8]],
  wave:[[30,-66,-.9],[38,-78,-1.3]],
  back:[[24,-48,.5],[20,-38,.8]]
};
function spiky(c,o){
  const x=o.x,y=o.y,s=o.s||240,K=(o.kind||'k')==='k',child=o.child!==false,face=o.face||'neutral',look=o.look||0;
  const body=K?'#1b1e2b':'#3f89c9',dark=K?'#040509':'#1d5285',rim=K?'#5e6994':'#a6d0f2',plate=K?'#2d3248':'#2f6ea8';
  const u=s/100;
  c.save();c.translate(x,y);if(o.flip)c.scale(-1,1);c.rotate(o.tilt||0);c.scale(u,u);
  c.lineJoin='round';c.lineCap='round';c.lineWidth=2.4;c.strokeStyle=dark;
  const hr=child?27:23,hy=-58-hr*.78;
  // pernas
  function perna(sd,L){L=L||17;c.fillStyle=body;rr(c,-6,-2,12,L,5);c.fill();c.stroke();
    ell(c,sd*2,L-.5,9.6,5.4);c.fill();c.stroke();
    c.save();c.strokeStyle=plate;c.lineWidth=1.2;c.beginPath();c.moveTo(sd*2-6,L-1.4);c.quadraticCurveTo(sd*2,L-3.6,sd*2+6,L-1.4);c.stroke();c.restore();
    if(K){c.save();c.fillStyle='#d8d2c6';c.lineWidth=1.1;for(const dx of [-5.6,0,5.6]){const fx=sd*2+dx,fy=L+2.4;c.beginPath();c.moveTo(fx-2.1,fy-1.6);c.quadraticCurveTo(fx-.6,fy+3.4,fx+sd*1.6,fy+6);c.quadraticCurveTo(fx+1.1,fy+1.2,fx+2.1,fy-1.6);c.closePath();c.fill();c.stroke();}c.restore();}
    else{for(const dx of [-5.6,0,5.6]){c.fillStyle=body;ell(c,sd*2+dx,L+3.2,2.8,2.4);c.fill();c.stroke();}}}
  if(o.pose==='sit'){
    for(const sd of [-1,1]){c.save();c.translate(sd*12,-12);perna(sd,6);c.restore();}
  }else if(o.pose!=='none'){
    const run=o.pose==='run'?.5:0;
    for(const sd of [-1,1]){c.save();c.translate(sd*10,-20);c.rotate(sd*run);perna(sd);c.restore();}
  }
  // braços (gomos com espinho na ponta)
  const armsR=ARMS[o.armsR||o.arms||'stand'],armsL=ARMS[o.armsL||o.arms||'stand'];
  function lobes(sd,set){for(const [ax,ay,rt] of set){c.save();c.translate(sd*ax,ay);c.rotate(sd*rt);c.fillStyle=body;ell(c,0,0,10.5,7.2);c.fill();c.stroke();poly(c,[sd*8,-3,sd*8,3,sd*18,0]);c.fill();c.stroke();c.restore();}}
  lobes(-1,armsL);
  // tronco em placas
  c.fillStyle=body;rr(c,-21,-60,42,44,12);c.fill();c.stroke();
  c.save();c.strokeStyle=plate;c.lineWidth=1.8;c.beginPath();c.moveTo(-7,-57);c.lineTo(-7,-19);c.moveTo(7,-57);c.lineTo(7,-19);if(!K){c.moveTo(-19,-38);c.lineTo(19,-38);}c.stroke();
  c.strokeStyle=rim;c.globalAlpha=.55;c.lineWidth=1.4;c.beginPath();c.moveTo(-18.5,-52);c.lineTo(-18.5,-24);c.stroke();c.restore();
  lobes(1,armsR);
  // espinhos da cabeça
  const n=13,tip=K?15:11;
  for(let i=0;i<n;i++){const a=(150+i*(240/(n-1)))*Math.PI/180;const b1=a-.13,b2=a+.13;
    const p=[Math.cos(b1)*hr*.9,hy+Math.sin(b1)*hr*.9,Math.cos(a)*(hr+tip),hy+Math.sin(a)*(hr+tip),Math.cos(b2)*hr*.9,hy+Math.sin(b2)*hr*.9];
    c.fillStyle=body;c.beginPath();c.moveTo(p[0],p[1]);
    if(K)c.lineTo(p[2],p[3]);else c.quadraticCurveTo(p[2]*1.02,p[3]-1,p[2],p[3]),c.quadraticCurveTo(p[2]*1.02,p[3]+1,p[4],p[5]);
    c.lineTo(p[4],p[5]);c.closePath();c.fill();c.stroke();}
  c.fillStyle=body;ell(c,0,hy,hr,hr);c.fill();c.stroke();
  c.save();c.strokeStyle=rim;c.globalAlpha=.5;c.lineWidth=1.4;c.beginPath();c.arc(0,hy,hr-2.5,Math.PI*.75,Math.PI*1.15);c.stroke();c.restore();
  // rosto
  const ex=hr*.31+look*3,ey=hy+1;
  if(!K){
    c.fillStyle='#f4dcc1';c.strokeStyle='#c9a68a';c.lineWidth=1;ell(c,look*3,hy+4,hr*.74,hr*.68);c.fill();c.stroke();
    const er=hr*(child?.135:.115)*(face==='surprised'?1.25:1);
    c.fillStyle='#0b0b10';
    if(face==='sleep'||face==='blink'||face==='laugh'){c.strokeStyle='#0b0b10';c.lineWidth=2;for(const sd of [-1,1]){c.beginPath();c.arc(sd*ex+look*3,ey+1,er,face==='laugh'?Math.PI*1.1:.15,face==='laugh'?Math.PI*1.9:Math.PI-.15);c.stroke();}}
    else{for(const sd of [-1,1]){ell(c,sd*ex,ey,er,er*1.12);c.fill();c.fillStyle='#fff';ell(c,sd*ex-er*.3,ey-er*.35,er*.32,er*.32);c.fill();c.fillStyle='#0b0b10';}}
    if(face==='angry'||face==='stern'){c.strokeStyle='#0b0b10';c.lineWidth=2.2;for(const sd of [-1,1]){c.beginPath();c.moveTo(sd*(ex+er*1.4),ey-er*2);c.lineTo(sd*(ex-er*1.2),ey-er*1.3);c.stroke();}}
    c.fillStyle='#0b0b10';ell(c,look*3,hy+8,2.4,1.8);c.fill();
    c.strokeStyle='#5a2a1a';c.lineWidth=1.8;const my=hy+13;
    if(face==='smile'||face==='sleep'){c.beginPath();c.arc(look*3,my-3,6,.25,Math.PI-.25);c.stroke();}
    else if(face==='laugh'||face==='grin'){const arco=()=>{c.beginPath();c.arc(look*3,my-2,7,0,Math.PI);c.closePath();};arco();c.fillStyle='#7a2a22';c.fill();c.save();arco();c.clip();c.fillStyle='#fffaf0';c.fillRect(look*3-7,my-2,14,2.8);c.fillStyle='#e0707a';ell(c,look*3,my+4.2,4,2.4);c.fill();c.restore();arco();c.stroke();}
    else if(face==='sad'){c.beginPath();c.arc(look*3,my+4,5,Math.PI+.5,TAU-.5);c.stroke();}
    else if(face==='surprised'){ell(c,look*3,my,2.6,3.2);c.stroke();}
    else{c.beginPath();c.moveTo(look*3-4,my);c.lineTo(look*3+4,my);c.stroke();}
  }else{
    const big=child?1.25:1;
    if(face==='sleep'||face==='blink'){c.strokeStyle='#ff6a33';c.lineWidth=2;for(const sd of [-1,1]){c.beginPath();c.moveTo(sd*ex-5,ey+1);c.quadraticCurveTo(sd*ex,ey+3,sd*ex+5,ey+1);c.stroke();}}
    else{c.save();c.shadowColor='#ff3b10';c.shadowBlur=9;
      for(const sd of [-1,1]){const w=6.2*big*(face==='surprised'?1.15:1),h=(face==='angry'?3.4:face==='smug'&&sd>0?2.4:5.2)*big*(face==='surprised'?1.25:1);
        c.fillStyle='#ff5a1f';c.beginPath();c.moveTo(sd*ex-w,ey);c.quadraticCurveTo(sd*ex,ey-h*1.6,sd*ex+w,ey);c.quadraticCurveTo(sd*ex,ey+h*1.2,sd*ex-w,ey);c.fill();
        c.fillStyle='#ffd2a6';ell(c,sd*ex+look*1.5,ey,1.8*big,1.8*big);c.fill();}
      c.restore();
      if(face==='angry'){c.strokeStyle=dark;c.lineWidth=3;for(const sd of [-1,1]){c.beginPath();c.moveTo(sd*(ex+8),ey-7);c.lineTo(sd*(ex-6),ey-3);c.stroke();}}}
    const my=hy+12;c.lineWidth=1.8;
    if(face==='grin'||face==='laugh'||face==='angry'||face==='smug'){
      const ox=look*3,w=face==='smug'?9.5:(child?11:13.5),yl=my-2,yr=my-(face==='smug'?6:2);
      const up=face==='angry'?my-1:my+2,dn=face==='laugh'?my+13:face==='angry'?my+6:my+9.5;
      const q=(t,cy)=>{const a=1-t;return [a*a*(ox-w)+2*a*t*ox+t*t*(ox+w),a*a*yl+2*a*t*cy+t*t*yr];};
      const boca=()=>{c.beginPath();c.moveTo(ox-w,yl);c.quadraticCurveTo(ox,up,ox+w,yr);c.quadraticCurveTo(ox,dn,ox-w,yl);c.closePath();};
      boca();c.fillStyle='#2a070a';c.fill();
      c.save();boca();c.clip();
      if(face==='laugh'){c.fillStyle='#8a2a30';ell(c,ox,dn-2,w*.45,3);c.fill();}
      const nt=child?6:8,th=child?3.4:4.8;c.fillStyle='#f4efe4';c.strokeStyle='#8f877a';c.lineWidth=.6;
      for(let i=0;i<nt;i++){const a=q(i/nt,up),b=q((i+1)/nt,up),m=q((i+.5)/nt,up);c.beginPath();c.moveTo(a[0],a[1]-1.2);c.lineTo(b[0],b[1]-1.2);c.lineTo(m[0],m[1]+th);c.closePath();c.fill();c.stroke();}
      if(face!=='smug'){for(let i=0;i<nt-1;i++){const a=q((i+.5)/nt,dn),b=q((i+1.5)/nt,dn),m=q((i+1)/nt,dn);c.beginPath();c.moveTo(a[0],a[1]+1.2);c.lineTo(b[0],b[1]+1.2);c.lineTo(m[0],m[1]-th*.8);c.closePath();c.fill();c.stroke();}}
      c.restore();
      c.strokeStyle=rim;c.lineWidth=1.3;boca();c.stroke();
    }else if(face==='surprised'){c.strokeStyle=rim;ell(c,look*3,my+1,2.6,3.2);c.stroke();}
    else if(face==='sad'){c.strokeStyle=rim;c.beginPath();c.arc(look*3,my+5,5,Math.PI+.6,TAU-.6);c.stroke();}
    else if(face==='smile'){c.strokeStyle=rim;c.beginPath();c.arc(look*3,my-3,6,.3,Math.PI-.3);c.stroke();}
    else{c.strokeStyle=rim;c.beginPath();c.moveTo(look*3-4,my+1);c.lineTo(look*3+4,my+1);c.stroke();}
  }
  c.restore();
}

/* ---------- HUMANOS ---------- */
const GENTE={
  mae:{roupa:'#7d4f3b',orla:'#d9c7a5',cabelo:'#4e2f20',pele:'#e8c29e',longo:1},
  pai:{roupa:'#46523a',orla:'#2f3828',cabelo:'#a39e92',pele:'#dcb48f',barba:1},
  lyra:{roupa:'#f2efe6',orla:'#cfd6de',cabelo:'#dde2ea',pele:'#f2d4bb',longo:1},
  sacerdote:{roupa:'#ece6d6',orla:'#c9a24a',capuz:1},
  sentinela:{roupa:'#c7cad1',orla:'#c9a24a',elmo:1,lanca:1},
  guardiao:{roupa:'#e8e4da',orla:'#9a958a',mascara:1,lanca:1,rachado:1},
  mascate:{roupa:'#7a3d68',orla:'#e0b04a',cabelo:'#2b1d14',pele:'#e2b48c',chapeu:1,bigode:1}
};
function human(c,o){
  const g=GENTE[o.kind],u=(o.s||320)/100,face=o.face||'neutral',arms=o.arms||'down';
  c.save();c.translate(o.x,o.y);if(o.flip)c.scale(-1,1);c.rotate(o.tilt||0);c.scale(u,u);c.lineJoin='round';c.lineCap='round';c.strokeStyle='#120f0c';c.lineWidth=1.6;
  if(g.lanca){c.save();c.strokeStyle='#6b5a3a';c.lineWidth=2.6;c.beginPath();c.moveTo(22,8);c.lineTo(22,-128);c.stroke();c.fillStyle=g.mascara?'#e9e6de':'#d8d2c0';poly(c,[18,-126,22,-142,26,-126]);c.fill();c.stroke();c.restore();}
  if(g.longo){c.fillStyle=g.cabelo;rr(c,-11,-100,22,42,9);c.fill();c.stroke();}
  // corpo
  c.fillStyle=g.roupa;poly(c,[-13,-80,13,-80,22,0,-22,0]);c.fill();c.stroke();
  c.strokeStyle=g.orla;c.lineWidth=2;c.beginPath();c.moveTo(-14,-52);c.lineTo(14,-52);c.stroke();
  if(g.rachado){c.strokeStyle='#8f897c';c.lineWidth=1.1;c.beginPath();c.moveTo(-6,-72);c.lineTo(-2,-60);c.lineTo(-7,-48);c.moveTo(8,-40);c.lineTo(4,-28);c.lineTo(9,-16);c.stroke();}
  if(o.kind==='mae'){c.fillStyle=g.orla;poly(c,[-9,-50,9,-50,13,-14,-13,-14]);c.fill();}
  c.strokeStyle='#120f0c';c.lineWidth=1.6;
  // braços
  c.save();c.strokeStyle=g.roupa;c.lineWidth=7;
  const A={down:[[-14,-74,-19,-40],[14,-74,19,-40]],out:[[-14,-74,-19,-40],[14,-74,34,-62]],up:[[-14,-74,-26,-104],[14,-74,26,-104]],hold:[[-14,-74,-4,-50],[14,-74,4,-50]],hug:[[-14,-74,8,-58],[14,-74,-8,-62]],chest:[[-14,-74,-19,-40],[14,-74,30,-70]],reach:[[-14,-74,-19,-40],[14,-74,40,-80]]}[arms]||[[-14,-74,-19,-40],[14,-74,19,-40]];
  for(const [a,b,cx,cy] of A){c.beginPath();c.moveTo(a,b);c.quadraticCurveTo((a+cx)/2+(a<0?-4:4),(b+cy)/2,cx,cy);c.stroke();}
  c.restore();

/* ---------- MONTAGEM ---------- */
const raiz=document.getElementById('gibi');const quadros=[];
PAGINAS.forEach((pg,i)=>{const sec=document.createElement('section');sec.className='pagina';sec.setAttribute('aria-label','Página '+(i+1));
  const n=document.createElement('div');n.className='num';n.textContent='Página '+(i+1);sec.appendChild(n);
  pg.forEach(q=>{const d=document.createElement('div');d.className='quadro';const cv=document.createElement('canvas');cv.style.aspectRatio='1 / '+q.ar;cv.setAttribute('role','img');d.appendChild(cv);
    q.baloes.forEach(b=>{if(b.titulo){const t=document.createElement('div');t.className='titulo';t.innerHTML='<strong>KRAVENOX: ANTES DO CISMA</strong><span>Capítulo 1: A Velha Torre</span>';d.appendChild(t);return;}
      const e=document.createElement('div');e.className=b.c;e.textContent=b.t;e.style.left=b.x+'%';e.style.top=b.y+'%';if(b.w)e.style.maxWidth=b.w+'%';d.appendChild(e);});
    sec.appendChild(d);quadros.push([cv,q]);});
  raiz.appendChild(sec);});
const fim=document.createElement('footer');fim.className='fim';fim.innerHTML='<h2>Fim do capítulo 1</h2><p>Baseado em <em>Reino Quebrado</em>, de Rone Ignacio da Silva. As falas da corrida, da estrada, da promessa sob a árvore e da mãe diante da Fonte vêm do livro (Prólogo, caps. 4, 10, 13 e 19). O resto é história nova do gibi, ainda em aprovação.</p><p>Arte provisória feita em código, para ler a história em formato de gibi enquanto o desenhista não chega.</p>';raiz.appendChild(fim);

function desenha(cv,q){const w=cv.clientWidth||600;const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(w*q.ar*dpr);const c=cv.getContext('2d');const k=cv.width/1000;c.setTransform(k,0,0,k,0,0);c.save();try{q.draw(c,1000,1000*q.ar);}catch(err){console.error(err);}c.restore();}
function tudo(){quadros.forEach(([cv,q])=>desenha(cv,q));}
let t0=0,ultimaLargura=0;
function aoMudar(){const w=raiz.clientWidth;if(Math.abs(w-ultimaLargura)<4)return;ultimaLargura=w;clearTimeout(t0);t0=setTimeout(tudo,120);}
window.addEventListener('resize',aoMudar);
ultimaLargura=raiz.clientWidth;tudo();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
